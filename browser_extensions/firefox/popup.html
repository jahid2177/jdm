<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Download with JDM</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header><span class="logo">↓</span><div><strong>Jahid Download Manager</strong><small>Windows browser integration</small></div></header>
    <form id="form">
      <label for="url">Download URL</label>
      <input type="url" id="url" placeholder="https://example.com/file.zip" required>
      <label for="filename">File name (optional)</label>
      <input type="text" id="filename" maxlength="255" placeholder="Leave empty to infer from URL">
      <button id="send" type="submit">Send to JDM</button>
    </form>
    <p id="status" role="status">Open JDM on Windows before sending a link.</p>
    <script src="popup.js"></script>
  </body>
</html>
