name: jahid_download_manager
description: A cross-platform download manager for Windows and Android.
publish_to: none
version: 0.8.0+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  # Pin the Dart 3.4-compatible tray API. 0.7+ needs Dart 3.13.
  tray_manager: 0.5.3
  window_manager: ^0.5.2
  flutter_background: ^1.3.1
  # Compatible with the project's Dart 3.4 / Gradle baseline.
  cross_file: 0.3.4+2
  open_filex: 4.7.0
  share_plus: 11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
