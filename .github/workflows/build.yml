name: Build JDM Windows and Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.jahidul .
      - run: flutter pub get
      - run: python tools/check_release.py
      - run: dart format lib test native_messaging
      - run: flutter analyze
      - run: flutter test
      - name: Test browser extension message handling
        run: node test/browser_extension_test.js
      - name: Test browser page download scanner
        run: node test/browser_page_scanner_test.js
      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: JDM-Android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform scaffold
        run: flutter create --platforms=windows --org com.jahidul .
      - run: flutter pub get
      - run: python tools/check_release.py
      - run: dart format lib test native_messaging
      - run: flutter analyze
      - run: flutter test
      - name: Test browser extension message handling
        run: node test/browser_extension_test.js
      - name: Test browser page download scanner
        run: node test/browser_page_scanner_test.js
      - name: Build Windows x64
        run: flutter build windows --release
      - name: Compile Dart native messaging host
        run: dart compile exe native_messaging/bin/jdm_native_host.dart -o build/windows/x64/runner/Release/jdm_native_host.exe
      - name: Include extension and Windows registration scripts
        shell: pwsh
        run: |
          Copy-Item -Path 'browser_extensions' -Destination 'build/windows/x64/runner/Release/browser_extensions' -Recurse
          Copy-Item -Path 'browser_integration' -Destination 'build/windows/x64/runner/Release/browser_integration' -Recurse
      - name: Package Windows release directory
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'JDM-Windows-x64.zip' -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JDM-Windows-x64
          path: JDM-Windows-x64.zip
          if-no-files-found: error
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler ISCC.exe is missing from the Windows runner.' }
          & $compiler 'installer/jdm.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JDM-Windows-Installer-x64
          path: build/installer/JDM-Setup-v2.0.0-Windows-x64.exe
          if-no-files-found: error
